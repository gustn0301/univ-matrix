<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생기부 매트릭스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M20 30h60M20 50h60M20 70h60M40 20v60' stroke='white' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--sub:#6b7280;--line:#e2e5ea;--pri:#2563eb;--lock:#f1f3f6}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2127;--tx:#eceff4;--sub:#9aa3b0;--line:#2e343d;--pri:#5b8def;--lock:#252a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;min-height:100dvh}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--sub);font-size:14px;margin:0 0 18px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:10px 16px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#login{max-width:380px;margin:12dvh auto 0}
#login label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
#login button{width:100%;margin-top:18px}
.err{color:#dc2626;font-size:13px;min-height:18px;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{border-bottom:1px solid var(--line);padding:0;vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{width:96px;background:var(--lock);font-weight:600;text-align:center;vertical-align:middle;user-select:none;padding:10px;border-right:1px solid var(--line)}
td textarea{border:0;border-radius:0;resize:none;min-height:56px;display:block}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.status{font-size:12px;color:var(--sub)}
.review{text-align:center;margin-top:12dvh}
.review p{font-size:18px;font-weight:600;margin:0 0 28px}
.row{display:flex;justify-content:space-between;gap:12px}
.row button{flex:1}
</style>
</head>
<body>

<div id="login" class="card">
  <h1>생기부 매트릭스</h1>
  <p class="sub">학번과 이름을 입력해 로그인하세요.</p>
  <label>학번</label><input id="sid" inputmode="numeric" autocomplete="off" placeholder="예) 20201">
  <label>이름</label><input id="sname" autocomplete="off" placeholder="이름">
  <button class="pri" id="loginBtn">로그인</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="main" class="wrap hide">
  <div class="top"><div><h1 style="margin:0">생기부 매트릭스</h1><div class="sub" id="who" style="margin:2px 0 0"></div></div><button id="logout">로그아웃</button></div>
  <div class="tabs" id="tabs"></div>
  <table id="tbl"></table>
  <div class="foot"><span class="status" id="status"></span><button class="pri" id="next">다음→</button></div>
</div>

<div id="review" class="wrap review hide">
  <p>이 내용은 바로 선생님께 전달됩니다.<br>검토하시겠습니까?</p>
  <div class="row"><button id="back">←돌아가서 검토하기</button><button class="pri" id="submit">제출하기→</button></div>
  <div class="err" id="subMsg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoNB8ITbgNoB8pVVbBqFV-aK3DGmMtTLc",
  authDomain: "daily-planner-4c2d8.firebaseapp.com",
  projectId: "daily-planner-4c2d8",
  storageBucket: "daily-planner-4c2d8.firebasestorage.app",
  messagingSenderId: "225196921978",
  appId: "1:225196921978:web:903ec099d91d653137d7c3"
};
// ▼ Apps Script 배포 후 받은 '웹 앱 URL'을 여기에 붙여넣으세요
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqxjL0-GbxXooPsWZywnBKoyZDcB4JggX7zh-nL-vujmLZNKeXLwb_StzvaFRoXjJ8Gw/exec";

const db = getFirestore(initializeApp(firebaseConfig));
const SUBJ = {1:["국어","수학","영어","사회","과학","정보","역사"],2:["국어","수학","영어","사회","과학","정보"],3:["국어","수학","영어","사회","과학","정보"]};
const $ = id => document.getElementById(id);
let user = null, grade = 1, data = {1:{},2:{},3:{}}, timer = null;

const show = v => ["login","main","review"].forEach(x => $(x).classList.toggle("hide", x !== v));
const setStatus = t => $("status").textContent = t;

// ---------- 로그인 ----------
async function login(sid, name){
  const snap = await getDoc(doc(db, "students", sid));
  if(!snap.exists()) return false;
  const vals = Object.values(snap.data()).map(v => String(v).trim());
  return vals.includes(name);
}
$("loginBtn").onclick = async () => {
  const sid = $("sid").value.trim(), name = $("sname").value.trim();
  $("loginErr").textContent = "";
  if(!sid || !name){ $("loginErr").textContent = "학번과 이름을 모두 입력하세요."; return; }
  $("loginBtn").disabled = true;
  try{
    if(await login(sid, name)){
      localStorage.setItem("sgb_user", JSON.stringify({sid, name}));
      await enter({sid, name});
    } else $("loginErr").textContent = "학번과 이름이 일치하지 않습니다.";
  }catch(e){ $("loginErr").textContent = "연결 오류가 발생했습니다. 잠시 후 다시 시도하세요."; }
  $("loginBtn").disabled = false;
};
["sid","sname"].forEach(i => $(i).addEventListener("keydown", e => { if(e.key==="Enter") $("loginBtn").click(); }));
$("logout").onclick = async () => { await saveNow(); localStorage.removeItem("sgb_user"); user = null; $("sid").value = $("sname").value = ""; show("login"); };

async function enter(u){
  user = u; $("who").textContent = `${u.sid} ${u.name}`;
  const local = JSON.parse(localStorage.getItem("sgb_data_"+u.sid) || "null");
  try{
    const s = await getDoc(doc(db, "matrix", u.sid));
    if(s.exists() && s.data().grades) data = merge(s.data().grades);
    else if(local) data = merge(local);
  }catch(e){ if(local) data = merge(local); }
  grade = 1; show("main"); render();
}
const merge = g => ({1:g[1]||{},2:g[2]||{},3:g[3]||{}});

// ---------- 표 ----------
function render(){
  $("tabs").innerHTML = [1,2,3].map(g => `<button class="${g===grade?"on":""}" data-g="${g}">${g}학년</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { grade = +b.dataset.g; render(); });
  const tb = $("tbl"); tb.innerHTML = "";
  SUBJ[grade].forEach((s, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="k">${s}</td><td><textarea rows="2" placeholder="생기부 키워드를 입력하세요 (Enter: 다음 칸)"></textarea></td>`;
    const ta = tr.querySelector("textarea");
    ta.value = data[grade][s] || "";
    fit(ta);
    ta.addEventListener("input", () => { data[grade][s] = ta.value; fit(ta); queueSave(); });
    ta.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey && !e.isComposing){
        e.preventDefault();
        const all = tb.querySelectorAll("textarea"), n = all[i+1];
        if(n) n.focus(); else ta.blur();
      }
    });
    tb.appendChild(tr);
  });
}
const fit = ta => { ta.style.height = "auto"; ta.style.height = Math.max(56, ta.scrollHeight) + "px"; };

// ---------- 자동 저장 (실시간 보존) ----------
function queueSave(){ setStatus("저장 중…"); clearTimeout(timer); timer = setTimeout(saveNow, 600); }
async function saveNow(){
  if(!user) return;
  clearTimeout(timer);
  localStorage.setItem("sgb_data_"+user.sid, JSON.stringify(data));
  try{
    await setDoc(doc(db, "matrix", user.sid), { name:user.name, grades:data, updatedAt:Date.now() }, { merge:true });
    setStatus("자동 저장됨");
  }catch(e){ setStatus("저장 실패 – 네트워크를 확인하세요"); }
}
window.addEventListener("beforeunload", () => { if(user) localStorage.setItem("sgb_data_"+user.sid, JSON.stringify(data)); });
document.addEventListener("visibilitychange", () => { if(document.hidden) saveNow(); });

// ---------- 다음 / 검토 / 제출 ----------
$("next").onclick = async () => { await saveNow(); $("subMsg").textContent = ""; show("review"); };
$("back").onclick = () => show("main");
$("submit").onclick = async () => {
  const btn = $("submit"); btn.disabled = true; $("subMsg").style.color = ""; $("subMsg").textContent = "제출 중…";
  await saveNow();
  try{
    await fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ sid:user.sid, name:user.name, grades:data }) });
    await setDoc(doc(db, "matrix", user.sid), { submittedAt:Date.now() }, { merge:true });
    $("subMsg").style.color = "#16a34a"; $("subMsg").textContent = "제출되었습니다. 다시 제출하면 최신 내용으로 덮어써집니다.";
  }catch(e){ $("subMsg").textContent = "제출에 실패했습니다. 다시 시도하세요."; }
  btn.disabled = false;
};

// ---------- 자동 로그인 ----------
const saved = JSON.parse(localStorage.getItem("sgb_user") || "null");
if(saved) enter(saved);
</script>
</body>
</html>
